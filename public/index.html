<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashasham</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f3f1;--acc:#2f5bea}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--card:#242424;--acc:#7b9bff}}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;font-weight:600}
#log{flex:1;overflow:auto;padding:0 16px}
.m{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}
.u{background:var(--acc);color:#fff;margin-left:20%}
small{color:var(--mut)}
form{display:flex;gap:8px;padding:12px 16px}
input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff}
img,video{max-width:100%;border-radius:8px}
</style></head><body>
<header>Dashasham <input id="key" placeholder="x-api-key (if set)" style="width:40%;float:right"></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask anything…" autocomplete="off"><button>Send</button></form>
<script>
const log=document.getElementById('log'),hist=[];
function add(t,c){const d=document.createElement('div');d.className='m '+(c||'');d.textContent=t;log.appendChild(d);log.scrollTop=1e9;return d}
f.onsubmit=async e=>{e.preventDefault();const msg=q.value.trim();if(!msg)return;q.value='';add(msg,'u');
 const w=add('Thinking…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-api-key':key.value},
  body:JSON.stringify({message:msg,history:hist.slice(-6)})});
  const j=await r.json();if(!r.ok)throw new Error(j.detail||r.status);
  w.textContent=j.answer;hist.push({role:'user',content:msg},{role:'assistant',content:j.answer});
  (j.media||[]).forEach(m=>{const s=m.url||m.data_uri;if(!s){return}
   const el=document.createElement(m.type==='image'?'img':m.type==='audio'?'audio':'video');el.src=s;if(m.type!=='image')el.controls=true;w.appendChild(el)});
  if(j.validation){const s=document.createElement('small');s.textContent='\nValidators: '+j.validation.votes.map(v=>v.verdict).join(', ');w.appendChild(s)}
 }catch(err){w.textContent='Error: '+err.message}};
</script></body></html>
